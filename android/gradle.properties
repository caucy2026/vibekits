# Keep Android builds responsive on developer machines. The previous 8 GiB
# daemon plus unrestricted workers could make the rest of Windows unusable.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=true
android.useAndroidX=true
# Pub packages live on C: while this workspace lives on D:. Kotlin's
# relocatable incremental cache cannot represent sources across those roots.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
