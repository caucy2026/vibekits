name: macOS Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-release.yml'
      - 'assets/**'
      - 'lib/**'
      - 'macos/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test_data/models/**'

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build unsigned macOS Release
        run: flutter build macos --release --no-pub

      - name: Package and checksum
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Vibekits.app \
            Vibekits-1.9.0-dev.69-macos-runner.zip
          shasum -a 256 Vibekits-1.9.0-dev.69-macos-runner.zip \
            > Vibekits-1.9.0-dev.69-macos-runner.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Vibekits-1.9.0-dev.69-macOS
          path: |
            Vibekits-1.9.0-dev.69-macos-runner.zip
            Vibekits-1.9.0-dev.69-macos-runner.zip.sha256
          if-no-files-found: error
          retention-days: 14
