name: macOS Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-release.yml'
      - 'assets/**'
      - 'lib/**'
      - 'macos/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test_data/models/**'
      - 'third_party/**'
      - 'tool/**'

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Restore bundled macOS runtime cache
        uses: actions/cache@v4
        with:
          path: |
            native/harness/macos/runtime
            native/7zip/macos/runtime
            native/git/macos/runtime
            native/github_cli/macos/runtime
          key: >-
            vibekits-macos12-runtimes-v1-${{
            hashFiles('tool/prepare_harness_runtime_macos.sh',
            'tool/patch_harness_runtime.mjs',
            'tool/list_harness_required_peers.mjs',
            'native/harness/*.mjs',
            'tool/prepare_7zip_runtime_macos.sh',
            'tool/prepare_git_runtime_macos.sh',
            'tool/prepare_github_cli_runtime_macos.sh') }}

      - name: Prepare Universal Harness runtime
        shell: bash
        run: |
          if [[ ! -x native/harness/macos/runtime/bin/node || \
                ! -f native/harness/macos/runtime/harness-runtime.json || \
                ! -f native/harness/macos/runtime/vibekits-mcp-server.mjs || \
                ! -f native/harness/macos/runtime/vibekits-approval.mjs || \
                ! -f native/harness/macos/runtime/vibekits-parent-watchdog.mjs || \
                ! -f native/harness/macos/runtime/vibekits-android-stress-mcp.mjs || \
                ! -f native/harness/macos/runtime/vibekits-session-rebind.mjs ]]; then
            ./tool/prepare_harness_runtime_macos.sh
          fi
          test -x native/harness/macos/runtime/bin/node
          test -f native/harness/macos/runtime/harness-runtime.json

      - name: Test Harness cross-project session rebind
        run: native/harness/macos/runtime/bin/node tool/test_harness_session_rebind.mjs

      - name: Prepare Universal 7-Zip runtime
        shell: bash
        run: |
          if [[ ! -x native/7zip/macos/runtime/7zz ]]; then
            ./tool/prepare_7zip_runtime_macos.sh
          fi
          test -x native/7zip/macos/runtime/7zz

      - name: Prepare Universal Git runtime
        shell: bash
        run: |
          if [[ ! -x native/git/macos/runtime/bin/git || \
                ! -x native/git/macos/runtime/libexec/git-core/git-remote-https || \
                ! -d native/git/macos/runtime/share/git-core/templates ]]; then
            ./tool/prepare_git_runtime_macos.sh
          fi
          test -x native/git/macos/runtime/bin/git
          test -x native/git/macos/runtime/libexec/git-core/git-remote-https

      - name: Prepare Universal GitHub CLI runtime
        shell: bash
        run: |
          if [[ ! -x native/github_cli/macos/runtime/bin/gh || \
                ! -f native/github_cli/macos/runtime/vibekits-github-cli-runtime.json ]]; then
            ./tool/prepare_github_cli_runtime_macos.sh
          fi
          test -x native/github_cli/macos/runtime/bin/gh
          native/github_cli/macos/runtime/bin/gh --version | head -n 1

      - name: Analyze macOS platform integration
        run: >-
          flutter analyze --no-pub
          lib/app/platform_storage_layout.dart
          lib/app/app_settings.dart
          lib/features/cleaner/domain/cleanup_platform_policy.dart
          lib/features/cleaner/presentation/cleaner_tab.dart

      - name: Test macOS storage and cleanup policy
        run: >-
          flutter test --no-pub
          test/platform_storage_layout_test.dart
          test/cleanup_platform_policy_test.dart
          test/app_settings_test.dart

      - name: Build unsigned macOS Release
        shell: bash
        run: |
          adb_source="$(command -v adb || true)"
          if [[ -z "$adb_source" && -n "${ANDROID_HOME:-}" ]]; then
            adb_source="$ANDROID_HOME/platform-tools/adb"
          fi
          if [[ -z "$adb_source" && -n "${ANDROID_SDK_ROOT:-}" ]]; then
            adb_source="$ANDROID_SDK_ROOT/platform-tools/adb"
          fi
          if [[ ! -x "$adb_source" ]]; then
            echo "GitHub macOS runner does not provide Android Platform-Tools adb." >&2
            exit 1
          fi
          VIBEKITS_ADB_SOURCE="$adb_source" \
            flutter build macos --release --no-pub

      - name: Verify Intel, Apple Silicon and macOS 12+ compatibility
        run: >-
          ./tool/verify_macos_release_compat.sh
          build/macos/Build/Products/Release/Vibekits.app

      - name: Ad-hoc sign local validation artifact
        run: >-
          ./tool/sign_macos_release.sh
          build/macos/Build/Products/Release/Vibekits.app

      - name: Package and checksum
        shell: bash
        run: |
          version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          archive="Vibekits-${version}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Vibekits.app \
            "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Vibekits-macOS-${{ github.run_number }}
          path: |
            Vibekits-*-macOS.zip
            Vibekits-*-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 14
