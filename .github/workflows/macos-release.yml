name: macOS Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/macos-release.yml'
      - 'assets/**'
      - 'lib/**'
      - 'macos/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test_data/models/**'

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze macOS platform integration
        run: >-
          flutter analyze --no-pub
          lib/app/platform_storage_layout.dart
          lib/app/app_settings.dart
          lib/features/cleaner/domain/cleanup_platform_policy.dart
          lib/features/cleaner/presentation/cleaner_tab.dart

      - name: Test macOS storage and cleanup policy
        run: >-
          flutter test --no-pub
          test/platform_storage_layout_test.dart
          test/cleanup_platform_policy_test.dart
          test/app_settings_test.dart

      - name: Build unsigned macOS Release
        run: flutter build macos --release --no-pub

      - name: Package and checksum
        shell: bash
        run: |
          version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          archive="Vibekits-${version}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Vibekits.app \
            "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Vibekits-macOS-${{ github.run_number }}
          path: |
            Vibekits-*-macOS.zip
            Vibekits-*-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 14
