name: Windows Compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-compatibility.yml'
      - 'assets/**'
      - 'lib/**'
      - 'native/harness/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'test/**'
      - 'tool/**'
      - 'windows/**'

concurrency:
  group: windows-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve dependencies
        run: flutter pub get

      - name: Prepare and test pinned Harness runtime
        shell: pwsh
        run: |
          $nodeDirectory = Split-Path (Get-Command node).Source
          .\tool\prepare_harness_runtime.ps1 -NodeDirectory $nodeDirectory
          & .\native\harness\windows\runtime\node.exe .\tool\test_harness_session_rebind.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Harness rebind verification failed' }

      - name: Prepare pinned Windows Git runtime
        shell: pwsh
        run: .\tool\prepare_git_runtime.ps1

      - name: Prepare pinned Windows Mihomo runtime
        shell: pwsh
        run: .\tool\prepare_mihomo_runtime.ps1

      - name: Prepare pinned Windows QEMU runtime
        shell: pwsh
        run: .\tool\prepare_qemu_runtime.ps1

      - name: Analyze shared application
        run: flutter analyze --no-pub

      - name: Test Harness UI interactions
        run: flutter test --no-pub test/deepseek_harness_test.dart

      - name: Test Harness agent integration
        run: flutter test --no-pub test/harness_agent_integration_test.dart

      - name: Test local Harness tool bridge
        run: flutter test --no-pub test/harness_tool_bridge_test.dart

      - name: Test LAN MCP server
        run: flutter test --no-pub test/lan_mcp_tool_server_test.dart

      - name: Test desktop self update contract
        run: flutter test --no-pub test/app_update_service_test.dart

      - name: Test shared application widgets
        run: flutter test --no-pub test/widget_test.dart

      - name: Compile Windows Release application
        run: flutter build windows --release --no-pub

      - name: Verify Windows executable and Harness payload
        shell: pwsh
        run: |
          .\tool\verify_windows_bundle.ps1 -Configuration Release -ExpectedVersion '1.9.0-dev.158+2158'

      - name: Package Windows Release candidate
        shell: pwsh
        run: |
          $bundle = Resolve-Path 'build\windows\x64\runner\Release'
          $archive = Join-Path $env:RUNNER_TEMP 'Vibekits-1.9.0-dev.158+2158-windows-x64.zip'
          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" | Out-File -LiteralPath "$archive.sha256" -Encoding ascii
          "archive=$archive" >> $env:GITHUB_OUTPUT
        id: package

      - name: Upload Windows Release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Vibekits-1.9.0-dev.158-2158-windows-x64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
